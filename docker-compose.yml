# SMART PRINT HUB - Docker Compose Orchestration
version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smartprinthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartprinthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartprinthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO S3 Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: smartprinthub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. Smart Print Hub Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartprinthub-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/smartprinthub?schema=public"
      JWT_SECRET: "smart-print-hub-production-jwt-secret-key-32-chars"
      STORAGE_DRIVER: "s3"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "smartprinthub-documents"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadminpassword"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
